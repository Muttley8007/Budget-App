<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pay Cycle Budget</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app-shell">

  <header class="hero">
    <h1>Pay Cycle Budget</h1>
    <p>Plan each pay and track what’s left.</p>
  </header>

  <section id="summary" class="summary-grid"></section>

  <section id="cardsTab">
    <div class="panel">
      <h2>Add Pay Period</h2>

      <input id="payDate" type="date">
      <input id="payAmt" type="number" placeholder="Expected pay">
      <textarea id="payNote" placeholder="Notes"></textarea>

      <button class="btn btn-primary" onclick="addPay()">Add Pay Period</button>
    </div>

    <div id="list"></div>
  </section>

</div>

<footer class="footer-actions">
  <button class="btn btn-secondary" onclick="exportData()">Export</button>
  <button class="btn btn-secondary" onclick="document.getElementById('importFile').click()">Restore</button>
  <input id="importFile" type="file" accept="application/json" style="display:none" onchange="importData(event)">
</footer>

<script src="app.js"></script>
</body>
</html>
