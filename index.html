<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pay Budget</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Pay Cycle Budget</h1>
    <p>Add a pay period, then add expenses under it.</p>
  </div>

  <div class="sum" id="summary"></div>

  <div class="card">
    <div class="actions">
      <button class="alt" onclick="showTab('dashboard')">Dashboard</button>
      <button class="alt" onclick="showTab('cards')">Cards</button>
    </div>
  </div>

  <div id="cardsTab">
    <div class="card">
      <h3>Add Pay Period</h3>
      <div class="row">
        <input id="payDate" type="date">
        <input id="payAmt" type="number" step="0.01" placeholder="Expected pay">
      </div>
      <textarea id="payNote" placeholder="Notes"></textarea>
      <button onclick="addPay()">Add Pay Period</button>
    </div>

    <div class="cards" id="list"></div>
  </div>

  <div id="dashboardTab" style="display:none;">
    <div class="card" id="dashboard"></div>
  </div>
</div>
<script src="app.js?v=3"></script>
</body>
</html>
